name: JE-8086 for OS X 10.9 (Intel)

on:
  workflow_dispatch:
  push:
    paths:
      - 'packaging/macos-legacy/test-snelheid-je8086.command'
      - '.github/workflows/macos-legacy-je8086.yml'

jobs:
  speedtest:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.9"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch the DSP library for OS X 10.9
        run: git -C source/cpu/dsp56300 apply ../../../packaging/macos-legacy/dsp56300-macos-legacy.patch

      - name: Select newest Xcode 16
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Install Ninja
        run: brew install ninja || true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 -DCMAKE_OSX_ARCHITECTURES=x86_64 -DTUS_X64_MARCH=ivybridge \
            -Dgearmulator_BUILD_JUCEPLUGIN=OFF \
            -Dgearmulator_SYNTH_OSIRUS=OFF -Dgearmulator_SYNTH_OSTIRUS=OFF -Dgearmulator_SYNTH_VAVRA=OFF \
            -Dgearmulator_SYNTH_XENIA=OFF -Dgearmulator_SYNTH_NODALRED2X=OFF -Dgearmulator_SYNTH_88EMU=OFF \
            -Dgearmulator_COMPONENT_DSPBRIDGE=OFF -DBUILD_TESTING=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-ld_classic"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --target JE8086TestConsole -- -k 0 2>&1 | tee build.log

      - name: Compile errors (if any)
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -60

      - name: Check against the OS X 10.9 SDK
        run: |
          BIN=$(find build -name JE8086TestConsole -type f -perm -u+x | head -1)
          echo "BIN=$BIN" >> $GITHUB_ENV
          otool -l "$BIN" | grep -A4 -E "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION"
          for URL in https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.9.sdk.tar.xz \
                     https://github.com/phracker/MacOSX-SDKs/releases/download/10.15/MacOSX10.9.sdk.tar.xz; do
            curl -fsSL "$URL" -o sdk.tar.xz && break
          done
          mkdir -p oldsdk && tar -xJf sdk.tar.xz -C oldsdk
          python3 packaging/macos-legacy/check_against_sdk.py oldsdk/MacOSX10.9.sdk "$BIN"

      - name: Package
        run: |
          mkdir -p dist/JE8086-snelheidstest
          cp "$BIN" dist/JE8086-snelheidstest/JE8086TestConsole
          cp packaging/macos-legacy/test-snelheid-je8086.command dist/JE8086-snelheidstest/test-snelheid.command
          chmod +x dist/JE8086-snelheidstest/*
          cd dist && ditto -c -k --keepParent JE8086-snelheidstest ../JE8086-snelheidstest-macOS10.9.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JE8086-snelheidstest-macOS10.9
          path: JE8086-snelheidstest-macOS10.9.zip
